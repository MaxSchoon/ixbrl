version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current (Dependabot bumps the SHA and the
  # trailing version comment together, which is what makes SHA-pinning maintainable).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci"

  # Keep the pinned dev/CI toolchain (ruff, lxml) current — same rationale as
  # the actions group above: a pin only stays safe if something bumps it.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-toolchain:
        patterns: ["*"]
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "chore"
