name: CI

# Runs on PRs (incl. forks — read-only token, no secrets) and on pushes to main.
# This job is the required status check enforced by the `main` ruleset; its job id
# (`ci`) is what the ruleset's required_status_checks context must match.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: drop the default token to read-only for the whole workflow.
permissions:
  contents: read

# One run per ref; cancel superseded runs to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to a full commit SHA (immutable); the comment tracks the version
      # and Dependabot bumps both together. ubuntu-latest already ships Python
      # 3.10+, so no setup-python action is needed (fewer third-party deps).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python version
        run: python3 --version

      # Install into an explicit venv, never the runner's system Python: on
      # PEP 668 "externally managed" images a bare `pip install` fails outright,
      # which would break this required check on an image bump. Versions are
      # pinned in requirements-dev.txt so the gate is reproducible run to run.
      - name: Install dev toolchain (ruff, lxml)
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Lint (ruff)
        run: .venv/bin/python -m ruff check scripts tests

      - name: Format (ruff)
        run: .venv/bin/python -m ruff format --check scripts tests

      # shellcheck is preinstalled on ubuntu-latest images.
      - name: Shell lint (shellcheck)
        run: shellcheck scripts/*.sh

      - name: Install libxml2-utils (xmllint)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: Assets are well-formed XML (xmllint)
        run: xmllint --noout assets/*.xml assets/*.xsd assets/*.xhtml

      - name: Skill guardrails (size, description, references, asset cross-refs)
        run: python3 tests/check_skill.py

      - name: Scripts compile
        run: python3 -m py_compile scripts/check_facts.py

      # Uses the venv (needs lxml). check_skill.py above deliberately stays on
      # system python3 — it is stdlib-only by design, so it runs before any install.
      - name: Fact pre-flight smoke test (scaffold skeleton)
        run: .venv/bin/python scripts/check_facts.py assets/ixbrl-skeleton.xhtml
